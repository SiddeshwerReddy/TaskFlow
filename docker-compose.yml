version: '3.8'

services:
  # -------------------------
  # Database Services
  # -------------------------
  mongodb:
    image: mongo:latest
    container_name: taskflow-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: taskflow-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # -------------------------
  # Application Services
  # -------------------------
  api:
    build: 
      context: ./backend
    container_name: taskflow-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=taskflow_docker_super_secret_key_123
    depends_on:
      - mongodb
      - redis
    command: npm run start
    restart: on-failure

  worker:
    build: 
      context: ./backend
    container_name: taskflow-worker
    environment:
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongodb
      - redis
      - api
    command: npm run worker
    restart: on-failure

volumes:
  mongodb_data:
  redis_data:
